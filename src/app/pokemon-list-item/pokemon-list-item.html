<div class="pokemon-card" (click)="toggle()">
  <h3>{{ pokemon().name.toString() | pokemonName:'Meet' | titlecase }}</h3>
<span class="badge" [class]="pokemon().type.toLowerCase()">
  {{ pokemon().type | uppercase}}
</span>

  <p>Gender: {{ pokemon().gender | genderLabel | uppercase }}</p>


  @if (expanded){
    <p>Generation: {{pokemon().generation}}</p>
    <button class="remove-button" (click)="removePokemon()">Delete the pokemon</button>
    <a [routerLink]="['/pokemon', pokemon().id]"(click)="$event.stopPropagation()">View Details</a>
    <a [routerLink]="['/pokemon/edit', pokemon().id]" (click)="$event.stopPropagation()">Edit Pokemon</a>
  }


</div>
